version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # chalk 5+ is ESM-only; monorepo packages are CommonJS (tsc moduleResolution: node).
      # Re-enable once packages migrate to ESM.
      - dependency-name: "chalk"
      # eslint-config-next 16 requires Next.js 16 + ESLint 9 flat config; cyoa-engine is on Next 15.
      # Allow minor/patch, block major until the Next 16 migration.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # commander 15 is ESM-only; CJS packages on Node 20 cannot require it.
      # Allow minor/patch, block major until the ESM migration.
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
      # Next 16 is a breaking major for the apps in this monorepo (Build & Test fails).
      # Allow minor/patch, block major until a dedicated Next 16 migration PR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # nanoid 4+ is ESM-only; CJS packages cannot require it (Build & Test fails).
      # Allow minor/patch, block major until the ESM migration.
      - dependency-name: "nanoid"
        update-types: ["version-update:semver-major"]
      # zod 4 is a breaking major (Build & Test fails).
      # Allow minor/patch, block major until a dedicated zod 4 migration PR.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # react 19 is a breaking major for this monorepo (Build & Test fails).
      # Allow minor/patch, block major until a dedicated React 19 migration PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # react-dom 19 is a breaking major (same migration as react 19 / #102).
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # better-sqlite3 13 is a breaking major (native module, Build & Test fails).
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

