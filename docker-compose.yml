services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: games_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: mcp_games
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/mcp-games-server/migrations:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games_user -d mcp_games"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Telemetry Bus
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MCP Games Server
  games-server:
    build:
      context: .
      dockerfile: packages/mcp-games-server/Dockerfile
    environment:
      HEALTH_PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "${GAMES_SERVER_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Browser-safe REST facade used by the flagship site.
  mcp-connector:
    build:
      context: .
      dockerfile: apps/mcp-connector/Dockerfile
    environment:
      PORT: "3001"
      NODE_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
    ports:
      - "${MCP_CONNECTOR_PORT:-3001}:3001"
    depends_on:
      games-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: mcp_games_network
